[package]
name = "vgplay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A fast, minimal sound player for Windows, built for instant startup."

[dependencies]
winit = "0.29"
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winreg = "0.52"
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis"] }
# Used only to read the source bit depth for the status line (rodio does not expose
# it). This is the same symphonia already pulled in transitively by rodio's decoders.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
